# RepoSync - Semana 7. Contenedores: servidor, api1, api2, nginx, cliente.
# API sin estado: ambas replicas consultan al MISMO servidor TCP.
# Externo solo 8080, puertos 8000/5000 exclusivamente internos.
services:
  servidor:
    build: .
    container_name: sd_servidor
    command: python servidor.py
    environment:
      PUERTO: "5000"
      TIMEOUT_CLIENTE: "60"
      SIN_LOCK: "0"
      PAUSA_CARRERA: "0"
    networks:
      - sd_net
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 5000), 2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api1:
    build: .
    container_name: sd_api1
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      REPLICA: api1
      SERVIDOR_HOST: servidor
      SERVIDOR_PUERTO: "5000"
      TIMEOUT_SERVIDOR: "3"
    networks:
      - sd_net
    depends_on:
      servidor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api2:
    build: .
    container_name: sd_api2
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      REPLICA: api2
      SERVIDOR_HOST: servidor
      SERVIDOR_PUERTO: "5000"
      TIMEOUT_SERVIDOR: "3"
    networks:
      - sd_net
    depends_on:
      servidor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: sd_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - sd_net
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/salud || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  cliente:
    build: .
    container_name: sd_cliente
    command: sleep infinity
    stdin_open: true
    tty: true
    environment:
      API_URL: http://nginx
      SERVIDOR_HOST: servidor
      SERVIDOR_PUERTO: "5000"
    networks:
      - sd_net
    depends_on:
      nginx:
        condition: service_healthy

networks:
  sd_net:
    name: sd_net
    driver: bridge
