# Semana 7. Puerta unica HTTP y balanceo entre las dos API sin estado.
# zone: comparten el contador round-robin TODOS los workers de Nginx.
upstream api {
    zone api 64k;
    server api1:8000 max_fails=1 fail_timeout=10s;
    server api2:8000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://api;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-Atendido-Por $upstream_addr always;
        add_header Cache-Control "no-store" always;
    }
}
